kind = "web"
previewPath = "/"
title = "Workforce Architecture"
description = "A strategic workforce design workspace for visualizing organizational structure, role capacity, skills coverage, and future-state scenarios."
version = "1.0.0"
id = "artifacts/workforce-architecture"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19049

[services.development]
run = "pnpm --filter @workspace/workforce-architecture run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workforce-architecture", "run", "build" ]
serve = "static"
publicDir = "artifacts/workforce-architecture/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19049"
BASE_PATH = "/"
